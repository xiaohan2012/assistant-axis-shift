name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ty type check
        run: uv run ty check

      - name: Cache HF tokenizers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tokenizers-${{ runner.os }}

      # tests/ plus the fork's Olmo tests; the rest of the fork suite is
      # governed by its own repo (and test_generation.py has a pre-existing
      # collection error upstream)
      - name: Pytest
        run: uv run pytest tests external/assistant-axis/assistant_axis/tests/test_olmo_conversation.py
